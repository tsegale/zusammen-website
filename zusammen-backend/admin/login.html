<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Zusammen Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0B1A2C 0%, #1F3A6D 100%);
    }
    .login-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .login-card {
      background: #fff; border-radius: 18px; padding: 48px 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo h1 {
      font-size: 21px; font-weight: 900; color: var(--primary);
      letter-spacing: 1px; line-height: 1.1;
    }
    .login-logo span {
      font-size: 12px; color: var(--muted); display: block; margin-top: 4px; letter-spacing: .5px;
    }
    .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
    .error-msg {
      background: #FEE2E2; color: #991B1B;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .btn-login { width: 100%; justify-content: center; padding: 11px; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <h1>ZUSAMMEN TOURS</h1>
        <span>Admin Panel</span>
      </div>
      <h2>Sign In</h2>
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@zusammentours.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-login" id="submitBtn">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const err = document.getElementById("errorMsg");
      btn.textContent = "Signing in…";
      btn.disabled = true;
      err.style.display = "none";
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = "/admin/index.html";
        } else {
          throw new Error(data.error || "Login failed");
        }
      } catch (error) {
        err.textContent = error.message;
        err.style.display = "block";
        btn.textContent = "Sign In";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
